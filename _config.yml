title: Banani Ghosh
description: Software engineer at Amazon working on LLM inference performance and ML systems. I write about GPUs, accelerators, and serving efficiency from first principles.
author: Banani Ghosh
url: "https://bananighosh.github.io"
baseurl: ""

# Profile links on the homepage. Leave a value empty to hide that link.
links:
  github: bananighosh
  linkedin: ""   # LinkedIn slug, e.g. banani-ghosh
  x: ""          # X handle without @
  leetcode: ""   # LeetCode username
  resume: ""     # e.g. /assets/resume.pdf after adding the file
  email: ""      # public contact email

# Used by jekyll-seo-tag for link previews
twitter:
  username: ""
social:
  name: Banani Ghosh
  links:
    - https://github.com/bananighosh

permalink: /:year/:month/:title/
timezone: America/Los_Angeles

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
  toc_levels: 2..2

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
      math: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
