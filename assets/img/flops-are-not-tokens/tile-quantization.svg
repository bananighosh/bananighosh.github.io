<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Helvetica, Arial, sans-serif"><rect width="960" height="420" fill="#fff"/><text x="480" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#222">Tile quantization: you pay for the whole tile</text><text x="480" y="52" text-anchor="middle" font-size="13" fill="#666">A matrix unit processes rows in fixed tiles of 128. Rows you do not bring are padding.</text><text x="215" y="117" text-anchor="end" font-size="14" font-weight="700" fill="#222">Decode batch 8</text><rect x="230" y="90" width="300" height="44" rx="4" fill="#f5f5f5" stroke="#999" stroke-dasharray="4 3"/><rect x="230" y="90" width="18.8" height="44" rx="4" fill="#76b900"/><text x="547" y="117" font-size="13" fill="#333">6% useful</text><text x="215" y="207" text-anchor="end" font-size="14" font-weight="700" fill="#222">Batch 128</text><rect x="230" y="180" width="300" height="44" rx="4" fill="#f5f5f5" stroke="#999" stroke-dasharray="4 3"/><rect x="230" y="180" width="300.0" height="44" rx="4" fill="#76b900"/><text x="547" y="207" font-size="13" fill="#333">100% useful</text><text x="215" y="297" text-anchor="end" font-size="14" font-weight="700" fill="#222">Batch 129</text><rect x="230" y="270" width="300" height="44" rx="4" fill="#f5f5f5" stroke="#999" stroke-dasharray="4 3"/><rect x="230" y="270" width="300.0" height="44" rx="4" fill="#76b900"/><rect x="542" y="270" width="300" height="44" rx="4" fill="#f5f5f5" stroke="#999" stroke-dasharray="4 3"/><rect x="542" y="270" width="2.3" height="44" rx="4" fill="#76b900"/><text x="230" y="334" font-size="13" fill="#333">50% useful (2 tiles): one extra row costs a whole second tile</text><rect x="250" y="358" width="12" height="12" fill="#76b900"/><text x="268" y="369" font-size="12.5" fill="#444">useful rows</text><rect x="370" y="358" width="12" height="12" fill="#f5f5f5" stroke="#999" stroke-dasharray="3 2"/><text x="388" y="369" font-size="12.5" fill="#444">padding (paid for, wasted)</text><text x="480" y="402" text-anchor="middle" font-size="13" fill="#333">Useful fraction = rows ÷ (ceil(rows ÷ tile) × tile)</text></svg>