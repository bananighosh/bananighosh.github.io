" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="545" y="135" width="160" height="48" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="625.0" y="163.55" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Expert GEMMs · chip 2</text><path d="M 505 160 L 543 159" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M 705 159 L 743 160" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="545" y="195" width="160" height="48" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="625.0" y="223.55" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Expert GEMMs · chip N</text><path d="M 505 160 L 543 219" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M 705 219 L 743 160" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="745" y="125" width="140" height="70" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="815.0" y="155.4" text-anchor="middle" font-size="14" font-weight="700" fill="#222">All-to-all</text><text x="815.0" y="174.4" text-anchor="middle" font-size="12.5" fill="#555">COMBINE</text><rect x="910" y="135" width="75" height="50" rx="6" fill="#f5f5f5" stroke="#888" stroke-width="1.5"/><text x="947.5" y="155.55" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Next</text><text x="947.5" y="173.55" text-anchor="middle" font-size="11.5" fill="#555">layer</text><path d="M 150 160 L 178 160" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M 310 160 L 343 160" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M 885 160 L 908 160" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="500" y="280" text-anchor="middle" font-size="12.5" fill="#555">Fast domain: Trn3 UltraServer = 144 chips. Beyond it, all-to-all crosses scale-out networking.</text></svg>