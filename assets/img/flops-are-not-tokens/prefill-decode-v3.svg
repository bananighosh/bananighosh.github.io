<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs><rect width="960" height="500" fill="#fff"/><text x="480.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#222">Prefill vs decode: same model, two different bottlenecks</text><text x="480.0" y="52" text-anchor="middle" font-size="13" fill="#666">Prefill reuses each weight read across S tokens. Decode re-reads everything for one token.</text><rect x="30" y="75" width="390" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="225.0" y="100.25" text-anchor="middle" font-size="15" font-weight="700" fill="#222">PREFILL · compute-bound · sets TTFT</text><rect x="480" y="75" width="390" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="675.0" y="100.25" text-anchor="middle" font-size="15" font-weight="700" fill="#222">DECODE · memory-bound · sets TPOT</text><rect x="60" y="140" width="330" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="225.0" y="165.4" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Prompt of S tokens</text><text x="225.0" y="184.4" text-anchor="middle" font-size="12.5" fill="#555">processed all at once</text><rect x="60" y="235" width="330" height="70" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="225.0" y="265.4" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Fat GEMMs: B × S rows</text><text x="225.0" y="284.4" text-anchor="middle" font-size="12.5" fill="#555">one weight read feeds S tokens</text><rect x="60" y="340" width="330" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="225.0" y="365.4" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Write the KV cache</text><text x="225.0" y="384.4" text-anchor="middle" font-size="12.5" fill="#555">hand off to decode</text><path d="M 225 200 L 225 233" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M 225 305 L 225 338" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="510" y="140" width="330" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="675.0" y="165.4" text-anchor="middle" font-size="14" font-weight="700" fill="#222">1 new token per sequence</text><text x="675.0" y="184.4" text-anchor="middle" font-size="12.5" fill="#555">per step</text><rect x="510" y="235" width="330" height="70" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="675.0" y="265.4" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Read ALL weights + ALL KV cache</text><text x="675.0" y="284.4" text-anchor="middle" font-size="12.5" fill="#555">every single step</text><rect x="510" y="340" width="330" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="675.0" y="365.4" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Skinny GEMM: B rows</text><text x="675.0" y="384.4" text-anchor="middle" font-size="12.5" fill="#555">close to matrix × vector</text><path d="M 675 200 L 675 233" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M 675 305 L 675 338" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><path d="M 840 370 L 865 370 L 865 170 L 842 170" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="872" y="275" text-anchor="start" font-size="12" fill="#444">repeat</text><text x="872" y="291" text-anchor="start" font-size="12" fill="#444">per token</text><path d="M 390 370 L 450 370 L 450 170 L 508 170" fill="none" stroke="#555" stroke-width="3" marker-end="url(#a)"/><text x="450" y="445" text-anchor="middle" font-size="13" fill="#333">Arithmetic intensity (weights only): prefill = 2·B·S / bytes per param   ·   decode = 2·B / bytes per param</text><text x="450" y="470" text-anchor="middle" font-size="12.5" fill="#666">Prefill crosses every ridge point in this post once B·S passes 257 (FP8); decode almost never does.</text></svg>