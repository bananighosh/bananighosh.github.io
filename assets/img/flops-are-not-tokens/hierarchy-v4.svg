<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs><rect width="1000" height="660" fill="#ffffff"/><text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#222">Same job, two strategies: keep data on chip</text><text x="500" y="56" text-anchor="middle" font-size="13" fill="#666">Every arrow down is a trip that costs bandwidth and energy. The design question is who manages the trips.</text><rect x="30" y="72" width="450" height="30" rx="6" fill="#76b900"/><text x="255" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">GPU · NVIDIA B300 / AMD MI355X</text><rect x="520" y="72" width="450" height="30" rx="6" fill="#ff9900"/><text x="745" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">ASIC · AWS Trainium3</text><rect x="30" y="114" width="450" height="52" rx="6" fill="#e3f2fd" stroke="#64b5f6"/><text x="255" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#222">HBM</text><text x="255" y="155" text-anchor="middle" font-size="12" fill="#555">off-chip: weights + KV cache</text><rect x="520" y="114" width="450" height="52" rx="6" fill="#e3f2fd" stroke="#64b5f6"/><text x="745" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#222">HBM</text><text x="745" y="155" text-anchor="middle" font-size="12" fill="#555">off-chip: weights + KV cache</text><line x1="255" y1="166" x2="255" y2="186" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="745" y1="166" x2="745" y2="186" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="188" width="450" height="50" rx="6" fill="#f5f5f5" stroke="#999"/><text x="255" y="209" text-anchor="middle" font-size="14" font-weight="700" fill="#222">L2 / Infinity Cache · hardware-managed</text><text x="255" y="227" text-anchor="middle" font-size="12" fill="#555">shared by all SMs / CUs</text><rect x="520" y="188" width="450" height="50" rx="6" fill="#f5f5f5" stroke="#999"/><text x="745" y="209" text-anchor="middle" font-size="14" font-weight="700" fill="#222">128 DMA engines · software-managed</text><text x="745" y="227" text-anchor="middle" font-size="12" fill="#555">every transfer explicit: compiler or NKI kernel</text><line x1="255" y1="238" x2="255" y2="258" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="745" y1="238" x2="745" y2="258" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="260" width="450" height="236" rx="8" fill="#fbfff2" stroke="#76b900" stroke-width="2" stroke-dasharray="6 4"/><text x="45" y="281" font-size="13" font-weight="700" fill="#4a7300">SM (NVIDIA) / CU (AMD) · hundreds per chip</text><rect x="50" y="292" width="410" height="46" rx="6" fill="#fff" stroke="#999"/><text x="255" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Shared memory / LDS</text><text x="255" y="329" text-anchor="middle" font-size="12" fill="#555">programmer-managed SRAM, hundreds of KB per SM</text><line x1="255" y1="338" x2="255" y2="352" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="354" width="410" height="40" rx="6" fill="#fff" stroke="#999"/><text x="255" y="379" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Registers / Tensor Memory (Blackwell)</text><line x1="150" y1="394" x2="150" y2="408" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="360" y1="394" x2="360" y2="408" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="410" width="200" height="72" rx="6" fill="#e8f5e9" stroke="#76b900"/><text x="150" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Tensor / Matrix Cores</text><text x="150" y="455" text-anchor="middle" font-size="12" fill="#555">GEMMs: the FLOPS</text><text x="150" y="471" text-anchor="middle" font-size="12" fill="#555">on the spec sheet</text><rect x="260" y="410" width="200" height="72" rx="6" fill="#fff" stroke="#999"/><text x="360" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#222">CUDA cores / SIMD</text><text x="360" y="455" text-anchor="middle" font-size="12" fill="#555">softmax, norms,</text><text x="360" y="471" text-anchor="middle" font-size="12" fill="#555">elementwise</text><rect x="520" y="260" width="450" height="236" rx="8" fill="#fff8ec" stroke="#ff9900" stroke-width="2" stroke-dasharray="6 4"/><text x="535" y="281" font-size="13" font-weight="700" fill="#b36b00">NeuronCore-v4 · 8 per chip</text><rect x="540" y="292" width="410" height="46" rx="6" fill="#fff" stroke="#999"/><text x="745" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#222">SBUF · 32 MiB per core</text><text x="745" y="329" text-anchor="middle" font-size="12" fill="#555">software-managed SRAM, 128 partitions</text><line x1="700" y1="338" x2="700" y2="352" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="540" y="354" width="320" height="40" rx="6" fill="#fff3e0" stroke="#ff9900"/><text x="700" y="379" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Tensor Engine · 128×128 systolic array</text><line x1="640" y1="394" x2="640" y2="408" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="540" y="410" width="200" height="72" rx="6" fill="#fff" stroke="#999"/><text x="640" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#222">PSUM · 2 MiB</text><text x="640" y="455" text-anchor="middle" font-size="12" fill="#555">matmul accumulators</text><line x1="740" y1="446" x2="748" y2="446" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="750" y="410" width="200" height="72" rx="6" fill="#fff" stroke="#999"/><text x="850" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Vector · Scalar · GpSimd</text><text x="850" y="455" text-anchor="middle" font-size="12" fill="#555">softmax, norms,</text><text x="850" y="471" text-anchor="middle" font-size="12" fill="#555">elementwise</text><path d="M 930 410 L 930 374 Q 930 360 916 360 L 900 360 L 900 342" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="936" y="388" font-size="11" fill="#555">back to</text><text x="936" y="401" font-size="11" fill="#555">SBUF</text><rect x="30" y="506" width="450" height="56" rx="6" fill="#f1f8e9" stroke="#c5e1a5"/><text x="255" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#33691e">Latency hiding: hardware schedulers</text><text x="255" y="547" text-anchor="middle" font-size="12" fill="#444">thousands of threads in flight; stalled warps are swapped out</text><rect x="520" y="506" width="450" height="56" rx="6" fill="#fff3e0" stroke="#ffcc80"/><text x="745" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4f00">Latency hiding: overlapped engine streams (compiler or NKI)</text><text x="745" y="547" text-anchor="middle" font-size="12" fill="#444">double-buffered tiles, hardware semaphores between engines</text><rect x="30" y="572" width="450" height="40" rx="6" fill="#f5f5f5" stroke="#999"/><text x="255" y="597" text-anchor="middle" font-size="12.5" fill="#222">Scale-up: NVLink (72 GPUs) · Infinity Fabric (8 GPUs)</text><rect x="520" y="572" width="450" height="40" rx="6" fill="#f5f5f5" stroke="#999"/><text x="745" y="597" text-anchor="middle" font-size="12.5" fill="#222">Scale-up: NeuronLink-v4 (144 chips) · collectives on 16 CC-Cores</text><text x="500" y="644" text-anchor="middle" font-size="13" fill="#333"><tspan font-weight="700">The contrast:</tspan> GPU = many small SRAMs, hardware-scheduled. Trainium3 = 8 large SRAMs of 32 MiB each, software-scheduled.</text></svg>